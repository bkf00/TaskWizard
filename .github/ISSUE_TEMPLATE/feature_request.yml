name: Feature request
description: Propose a controlled product improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become easier or safer?
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Users affected
      description: Who benefits from this?
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Keep MVP constraints in mind.
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: This keeps human approval before Planner sync.
          required: true
        - label: This does not require processing all meetings automatically.
          required: true
        - label: This does not require committing real email/transcript data.
          required: true

