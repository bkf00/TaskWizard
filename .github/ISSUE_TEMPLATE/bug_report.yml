name: Bug report
description: Report a defect in the task extraction or approval workflow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real email content, transcripts, secrets, or customer data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use anonymized data only.
      placeholder: |
        1. Add source...
        2. Approve task...
        3. Observe...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ingestion
        - ai-extraction
        - approval
        - planner-sync
        - graph
        - security
        - ui
        - docs
    validations:
      required: true

