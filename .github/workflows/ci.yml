name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  local-mvp-tests:
    name: Local MVP tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Run dependency-free MVP tests
        run: node tools/test-local-mvp.mjs

  typescript-build:
    name: TypeScript and Next.js checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

